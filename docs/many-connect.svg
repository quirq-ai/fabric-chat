<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">How two companies connect</title>
  <desc id="d">Four steps. One: the companies swap public cards. Two: the inviting company builds the new workspace's first block from the two cards and sends it. Three: the invited company checks the block and joins its own peer and orderer. Four: both approve the same version of the chat's rules, and the workspace is live.</desc>
  <style>
    .card { fill: #ffffff; stroke: #dcdee3; }
    .num { fill: #17181c; }
    .numt { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .h { font-size: 16px; font-weight: 650; fill: #17181c; }
    .who { font-size: 12px; font-weight: 600; fill: #2b62d9; }
    .s { font-size: 12.5px; fill: #474a53; }
    .foot { font-size: 12.5px; fill: #5b5f6a; }
    .arrow { stroke: #9a9eaa; stroke-width: 2; fill: none; marker-end: url(#tip); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9eaa"/>
    </marker>
  </defs>
  <rect width="960" height="318" rx="16" fill="#fbfbfc"/>

  <g transform="translate(20,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">1</text>
    <text class="h" x="50" y="35">Swap cards</text>
    <text class="who" x="18" y="68">Both companies</text>
    <text class="s" x="18" y="94">A card is public: the</text>
    <text class="s" x="18" y="112">company's name, the</text>
    <text class="s" x="18" y="130">certificates of its certificate</text>
    <text class="s" x="18" y="148">authorities, and its nodes'</text>
    <text class="s" x="18" y="166">addresses. It holds no keys,</text>
    <text class="s" x="18" y="184">so it can be sent anywhere.</text>
  </g>
  <path class="arrow" d="M236 131 H250"/>

  <g transform="translate(256,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">2</text>
    <text class="h" x="50" y="35">Invite</text>
    <text class="who" x="18" y="68">The company that invites</text>
    <text class="s" x="18" y="94">Builds the new workspace's</text>
    <text class="s" x="18" y="112">first block from the two</text>
    <text class="s" x="18" y="130">cards and sends it. The block</text>
    <text class="s" x="18" y="148">names both companies and</text>
    <text class="s" x="18" y="166">the rule for changing it:</text>
    <text class="s" x="18" y="184">more than half must agree.</text>
  </g>
  <path class="arrow" d="M472 131 H486"/>

  <g transform="translate(492,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">3</text>
    <text class="h" x="50" y="35">Accept</text>
    <text class="who" x="18" y="68">The company that is invited</text>
    <text class="s" x="18" y="94">Checks that the block lists</text>
    <text class="s" x="18" y="112">the right two companies.</text>
    <text class="s" x="18" y="130">Then each company joins its</text>
    <text class="s" x="18" y="148">own peer and its own orderer</text>
    <text class="s" x="18" y="166">to the workspace, using its</text>
    <text class="s" x="18" y="184">own keys.</text>
  </g>
  <path class="arrow" d="M708 131 H722"/>

  <g transform="translate(728,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13" fill="#13794b"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">4</text>
    <text class="h" x="50" y="35">Agree on the rules</text>
    <text class="who" x="18" y="68">Both companies</text>
    <text class="s" x="18" y="94">Each approves the same</text>
    <text class="s" x="18" y="112">version of the chat's rules.</text>
    <text class="s" x="18" y="130">Once both have, the</text>
    <text class="s" x="18" y="148">workspace is live, and people</text>
    <text class="s" x="18" y="166">on both sides can open</text>
    <text class="s" x="18" y="184">channels and write.</text>
  </g>

  <text class="foot" x="480" y="270" text-anchor="middle">Run in a lab between two companies that were set up separately: about 20 seconds from first step to first message.</text>
  <text class="foot" x="480" y="292" text-anchor="middle">18 public files and one block crossed between them. No private key left either company.</text>
</svg>
