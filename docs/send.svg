<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 318" width="960" height="318" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">What happens when you press Send</title>
  <desc id="d">Four steps. One: the app signs the request with the sender's private key. Two: peers of enough companies run the chaincode and sign the result. Three: the orderers agree on an order and cut a block. Four: every peer on the channel checks the block and updates its own copy.</desc>
  <style>
    .card { fill: #ffffff; stroke: #dcdee3; }
    .num { fill: #17181c; }
    .numt { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .h { font-size: 16px; font-weight: 650; fill: #17181c; }
    .who { font-size: 12px; font-weight: 600; fill: #2b62d9; }
    .s { font-size: 12.5px; fill: #474a53; }
    .foot { font-size: 12.5px; fill: #5b5f6a; }
    .arrow { stroke: #9a9eaa; stroke-width: 2; fill: none; marker-end: url(#tip); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9eaa"/>
    </marker>
  </defs>
  <rect width="960" height="318" rx="16" fill="#fbfbfc"/>

  <g transform="translate(20,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">1</text>
    <text class="h" x="50" y="35">Sign</text>
    <text class="who" x="18" y="68">The sender's app</text>
    <text class="s" x="18" y="94">Signs the request with the</text>
    <text class="s" x="18" y="112">sender's private key. Their</text>
    <text class="s" x="18" y="130">certificate goes with it, so</text>
    <text class="s" x="18" y="148">every node knows who is</text>
    <text class="s" x="18" y="166">asking, and that nobody</text>
    <text class="s" x="18" y="184">else could have sent it.</text>
  </g>
  <path class="arrow" d="M236 131 H250"/>

  <g transform="translate(256,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">2</text>
    <text class="h" x="50" y="35">Endorse</text>
    <text class="who" x="18" y="68">Peers of enough companies</text>
    <text class="s" x="18" y="94">Each runs the chaincode</text>
    <text class="s" x="18" y="112">against its own copy of the</text>
    <text class="s" x="18" y="130">ledger and signs the result.</text>
    <text class="s" x="18" y="148">Nothing is written yet.</text>
    <text class="s" x="18" y="166">Open channel: more than half.</text>
    <text class="s" x="18" y="184">Private: those that keep it.</text>
  </g>
  <path class="arrow" d="M472 131 H486"/>

  <g transform="translate(492,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">3</text>
    <text class="h" x="50" y="35">Order</text>
    <text class="who" x="18" y="68">The channel's orderers</text>
    <text class="s" x="18" y="94">Agree, using Raft, on one</text>
    <text class="s" x="18" y="112">order for everyone's</text>
    <text class="s" x="18" y="130">transactions, and cut a block</text>
    <text class="s" x="18" y="148">every second. They never run</text>
    <text class="s" x="18" y="166">the chaincode, and see only</text>
    <text class="s" x="18" y="184">hashes of private messages.</text>
  </g>
  <path class="arrow" d="M708 131 H722"/>

  <g transform="translate(728,24)">
    <rect class="card" width="212" height="214" rx="14"/>
    <circle class="num" cx="28" cy="30" r="13" fill="#13794b"/>
    <text class="numt" x="28" y="34.5" text-anchor="middle">4</text>
    <text class="h" x="50" y="35">Check and commit</text>
    <text class="who" x="18" y="68">Every peer on the channel</text>
    <text class="s" x="18" y="94">Checks the signatures against</text>
    <text class="s" x="18" y="112">the channel's rule, checks that</text>
    <text class="s" x="18" y="130">nothing the transaction read</text>
    <text class="s" x="18" y="148">has changed, then updates its</text>
    <text class="s" x="18" y="166">own copy. Each company's app</text>
    <text class="s" x="18" y="184">sees the block arrive.</text>
  </g>

  <text class="foot" x="480" y="270" text-anchor="middle">About one second from Send to every company's screen. Nearly all of it is step 3 waiting to cut the block.</text>
  <text class="foot" x="480" y="292" text-anchor="middle">No company can skip a step for another: a peer applies only what it has checked itself.</text>
</svg>
