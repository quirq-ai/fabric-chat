# Builds the three images a company's server runs and publishes them to GitHub's container registry:
#
#   ghcr.io/quirq-ai/fabric-chat-chaincode:<version>   the chat's rules
#   ghcr.io/quirq-ai/fabric-chat-ctl:<version>         the admin tool that sets a node up
#   ghcr.io/quirq-ai/fabric-chat-app:<version>         the chat app
#
# <version> is the one in package.json. A company's server downloads them when its company.json
# says "images": "ghcr.io/quirq-ai/fabric-chat" and "release": "<version>".
#
# It runs when a version tag is pushed, such as v0.3.0, or by hand from the Actions tab.
# Nothing is published unless every step before the last one passes, and those steps start a real
# company on this machine: once step by step, and once with ./chat up as a company would.
name: Publish the images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: The tag must be the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi

      - name: Check the code and the chat's rules
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:chaincode

      - name: Build the three images
        run: npm run images

      - name: Start one company step by step and walk through its first day
        run: npm run test:company

      - name: Start a company with ./chat up, from the template as it comes
        run: |
          cp -r node-template "$RUNNER_TEMP/company"
          cd "$RUNNER_TEMP/company"
          # The template names the published images. This run must use the ones built above.
          sed -i 's#"images": "[^"]*"#"images": "fabric-chat"#' company.json
          ./chat up
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          echo
          ./chat status
          ./chat wipe aster.example

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish
        run: npm run images -- --push "ghcr.io/${{ github.repository_owner }}/fabric-chat"
